name: scrape-encar

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of listings"
        default: "10"
      offset:
        description: "Pagination offset"
        default: "0"
      query:
        description: "Encar filter expr (leave blank to use built-in default)"
        default: ""
      detail:
        description: "Fetch per-id detail (true/false)"
        default: "true"
      min_year:
        description: "Filter: min FormYear"
        default: ""
      max_year:
        description: "Filter: max FormYear"
        default: ""
      min_price_man:
        description: "Filter: min price (만원)"
        default: ""
      max_price_man:
        description: "Filter: max price (만원)"
        default: ""
      min_mileage_km:
        description: "Filter: min mileage"
        default: ""
      max_mileage_km:
        description: "Filter: max mileage"
        default: ""
      fuel:
        description: "Filter: fuel (가솔린/디젤/전기/하이브리드)"
        default: ""
      transmission:
        description: "Filter: transmission"
        default: ""
      manufacturer:
        description: "Filter: manufacturer"
        default: ""
      only_inspection:
        description: "Only listings with inspection report"
        default: "false"
      no_db:
        description: "Skip DB upsert (true = JSON artifact only)"
        default: "false"
  schedule:
    # Heartbeat — see scrape-guazi.yml for the chained-batch pattern.
    - cron: "15/30 * * * *"

permissions:
  contents: read
  actions: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: scrape-encar
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore normalizer cache
        uses: actions/cache@v4
        with:
          path: .cache/normalizer.sqlite
          key: normalizer-cache-${{ github.run_id }}
          restore-keys: |
            normalizer-cache-

      - name: Pipeline (scrape -> normalize -> upsert)
        env:
          PYTHONUNBUFFERED: "1"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '10' }}"
          OFFSET="${{ github.event.inputs.offset || '0' }}"
          QUERY="${{ github.event.inputs.query }}"
          DETAIL="${{ github.event.inputs.detail || 'true' }}"
          MIN_YEAR="${{ github.event.inputs.min_year }}"
          MAX_YEAR="${{ github.event.inputs.max_year }}"
          MIN_PRICE="${{ github.event.inputs.min_price_man }}"
          MAX_PRICE="${{ github.event.inputs.max_price_man }}"
          MIN_MILEAGE="${{ github.event.inputs.min_mileage_km }}"
          MAX_MILEAGE="${{ github.event.inputs.max_mileage_km }}"
          FUEL="${{ github.event.inputs.fuel }}"
          TRANSMISSION="${{ github.event.inputs.transmission }}"
          MANUFACTURER="${{ github.event.inputs.manufacturer }}"
          ONLY_INSPECTION="${{ github.event.inputs.only_inspection || 'false' }}"
          NO_DB="${{ github.event.inputs.no_db || 'false' }}"

          ARGS="encar --limit $LIMIT --offset $OFFSET --out out/encar.json"
          [ -n "$QUERY" ] && ARGS="$ARGS --query \"$QUERY\""
          [ "$DETAIL" = "false" ] && ARGS="$ARGS --no-detail"
          [ -n "$MIN_YEAR" ] && ARGS="$ARGS --min-year $MIN_YEAR"
          [ -n "$MAX_YEAR" ] && ARGS="$ARGS --max-year $MAX_YEAR"
          [ -n "$MIN_PRICE" ] && ARGS="$ARGS --min-price-man $MIN_PRICE"
          [ -n "$MAX_PRICE" ] && ARGS="$ARGS --max-price-man $MAX_PRICE"
          [ -n "$MIN_MILEAGE" ] && ARGS="$ARGS --min-mileage-km $MIN_MILEAGE"
          [ -n "$MAX_MILEAGE" ] && ARGS="$ARGS --max-mileage-km $MAX_MILEAGE"
          [ -n "$FUEL" ] && ARGS="$ARGS --fuel \"$FUEL\""
          [ -n "$TRANSMISSION" ] && ARGS="$ARGS --transmission \"$TRANSMISSION\""
          [ -n "$MANUFACTURER" ] && ARGS="$ARGS --manufacturer \"$MANUFACTURER\""
          [ "$ONLY_INSPECTION" = "true" ] && ARGS="$ARGS --only-inspection"
          [ "$NO_DB" = "true" ] && ARGS="$ARGS --no-db"

          echo "RUNNING: python -m core.pipeline $ARGS"
          eval "python -m core.pipeline $ARGS"

      - name: Show summary
        if: always()
        run: |
          [ -f out/encar.json ] || exit 0
          python <<'PY'
          import json
          d = json.load(open('out/encar.json'))
          print(f'Listings: {len(d)}')
          for l in d:
              mark = l.get('mark') or l.get('brand_canonical') or l['brand']
              mf = l.get('model_family') or ''
              mn = l.get('model') or ''
              cmpl = l.get('complectation') or l.get('badge') or ''
              mf_s = f"[{mf}]" if mf and mf != mn else ""
              print(f"  - {mark} {mf_s} {mn} ({cmpl}) | {l.get('year_month')} | {l.get('mileage_km')}km | {l.get('city')} | {l.get('price_amount')} {l.get('currency')} | vin={l.get('vin')}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encar-listings
          path: out/encar.json

      - name: Trigger next batch
        if: success() && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 15
          gh workflow run scrape-encar.yml --ref ${{ github.ref_name }} -f limit=10

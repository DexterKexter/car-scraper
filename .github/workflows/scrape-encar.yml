name: scrape-encar

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of listings"
        default: "10"
      offset:
        description: "Pagination offset"
        default: "0"
      query:
        description: "Encar filter expr (default = all visible cars)"
        default: "(And.Hidden.N._.CarType.Y.)"
      detail:
        description: "Fetch per-id detail (true/false)"
        default: "true"
      normalize:
        description: "Run AI normalizer (needs OPENROUTER_API_KEY secret)"
        default: "true"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          OFFSET="${{ github.event.inputs.offset }}"
          QUERY="${{ github.event.inputs.query }}"
          DETAIL="${{ github.event.inputs.detail }}"
          ARGS="--limit $LIMIT --offset $OFFSET --query $QUERY --out out/encar.json"
          if [ "$DETAIL" = "false" ]; then ARGS="$ARGS --no-detail"; fi
          python -m scrapers.encar $ARGS

      - name: AI normalize (brand/model/trim)
        if: ${{ github.event.inputs.normalize == 'true' && env.OPENROUTER_API_KEY != '' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -m core.normalizer out/encar.json out/encar.json

      - name: Show summary
        if: always()
        run: |
          [ -f out/encar.json ] || exit 0
          python <<'PY'
          import json
          d = json.load(open('out/encar.json'))
          print(f'Listings: {len(d)}')
          for l in d:
              bn = l.get('brand_canonical') or l['brand']
              mn = l.get('model_canonical') or l['model']
              tr = l.get('trim') or l['badge']
              print(f"  - {bn} {mn} [{tr}] | {l['year_month']} | {l['mileage_km']}km | {l['city']} | {l['price_man_won']}만 (~${l['price_usd']}) | vin={l['vin']}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encar-listings
          path: out/encar.json

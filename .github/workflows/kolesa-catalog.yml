name: kolesa-catalog

on:
  workflow_dispatch:
    inputs:
      workers:
        description: "Parallel brand fetches (keep low to avoid bans)"
        default: "3"
      brand_limit:
        description: "Cap brands fetched (empty = all)"
        default: ""
  schedule:
    # Refresh weekly — kolesa.kz brand/model taxonomy changes slowly.
    - cron: "0 3 * * 0"

permissions:
  contents: write   # auto-commit out/kolesa_catalog.json back to main

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build catalog
        env:
          PYTHONUNBUFFERED: "1"
          OXYLABS_USERNAME: ${{ secrets.OXYLABS_USERNAME }}
          OXYLABS_PASSWORD: ${{ secrets.OXYLABS_PASSWORD }}
          OXYLABS_COUNTRY: ${{ vars.OXYLABS_COUNTRY }}
        run: |
          ARGS="--out out/kolesa_catalog.json --workers ${{ github.event.inputs.workers }}"
          if [ -n "${{ github.event.inputs.brand_limit }}" ]; then
            ARGS="$ARGS --brand-limit ${{ github.event.inputs.brand_limit }}"
          fi
          python -m scrapers.kolesa_catalog $ARGS

      - name: Summary
        if: always()
        run: |
          [ -f out/kolesa_catalog.json ] || exit 0
          python <<'PY'
          import json
          c = json.load(open('out/kolesa_catalog.json'))
          print(f"Brands: {c['brand_count']}  Models: {c['model_count']}")
          rows = sorted(c['brands'].values(), key=lambda b: -b['count'])[:25]
          for b in rows:
              print(f"  {b['name']:24} count={b['count']:>6}  models={len(b['models'])}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kolesa-catalog
          path: out/kolesa_catalog.json

      # Auto-commit the fresh catalog so guazi/encar workflows (which checkout
      # main) pick it up automatically. Skipped when the JSON is unchanged so
      # we don't spam main with empty commits each Sunday.
      - name: Commit catalog to main
        if: success() && github.ref == 'refs/heads/main'
        run: |
          set -e
          [ -f out/kolesa_catalog.json ] || { echo "no catalog produced"; exit 0; }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f out/kolesa_catalog.json
          if git diff --staged --quiet; then
            echo "catalog unchanged — skipping commit"
            exit 0
          fi
          git commit -m "kolesa-catalog: refresh ($(date -u +%Y-%m-%d))

Auto-generated by .github/workflows/kolesa-catalog.yml run ${{ github.run_id }}."
          git push origin HEAD:main

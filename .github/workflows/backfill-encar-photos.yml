name: backfill-encar-photos

# One-off / on-demand: repair encar rows still holding the old 4-thumbnail
# galleries by re-fetching the detail API. No schedule — dispatch manually.
on:
  workflow_dispatch:
    inputs:
      max_imgs:
        description: "Re-fetch encar rows with at most this many photos"
        default: "4"
      limit:
        description: "Cap rows processed (empty = all stale)"
        required: false
      workers:
        description: "Parallel detail fetches"
        default: "6"

concurrency:
  group: backfill-encar-photos
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Backfill encar photo galleries
        env:
          PYTHONUNBUFFERED: "1"
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          ARGS="--max-imgs ${{ github.event.inputs.max_imgs || '4' }} --workers ${{ github.event.inputs.workers || '6' }}"
          [ -n "${{ github.event.inputs.limit }}" ] && ARGS="$ARGS --limit ${{ github.event.inputs.limit }}"
          echo "RUNNING: python -m core.backfill_encar_photos $ARGS"
          python -m core.backfill_encar_photos $ARGS

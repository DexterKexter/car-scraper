name: scrape-guazi

on:
  workflow_dispatch:
    inputs:
      path:
        description: "Listing path on en.guazi.com (e.g. /used-cars/, /used-cars/toyota/, /used-cars/bmw/x1/)"
        default: "/used-cars/"
      limit:
        description: "Number of listings"
        default: "10"
      detail:
        description: "Enrich detail pages (true/false)"
        default: "true"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install scrapling browsers
        run: scrapling install

      - name: Run scraper
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          PATH_ARG="${{ github.event.inputs.path }}"
          LIMIT="${{ github.event.inputs.limit }}"
          DETAIL="${{ github.event.inputs.detail }}"
          ARGS="--path $PATH_ARG --limit $LIMIT --out out/guazi.json"
          if [ "$DETAIL" = "false" ]; then ARGS="$ARGS --no-detail"; fi
          python -m scrapers.guazi $ARGS

      - name: Show summary
        if: always()
        run: |
          if [ -f out/guazi.json ]; then
            python -c "import json;d=json.load(open('out/guazi.json'));print(f'Listings: {len(d)}');[print(f'  - {l[\"brand\"]} {l[\"model\"]} {l[\"year\"]} {l[\"price_raw\"]}') for l in d]"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guazi-listings
          path: out/guazi.json

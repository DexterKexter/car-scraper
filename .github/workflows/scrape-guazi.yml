name: scrape-guazi

on:
  workflow_dispatch:
    inputs:
      path:
        description: "Path filter: /used-cars/, /used-cars/<brand>/, /used-cars/<brand>/<model>/, /used-cars/<body>/ (sedan|suv|hatchback|mini-van|pick-up|truck|van|wagon)"
        default: "/used-cars/"
      filters:
        description: "Query filters, space-separated key=value. Supported: price=MIN,MAX | horsepower=MIN,MAX | tradeType=buyItNow|sealedBid"
        default: ""
      limit:
        description: "Number of listings"
        default: "10"
      detail:
        description: "Enrich detail pages (true/false)"
        default: "true"
      normalize:
        description: "Run AI normalizer (needs OPENROUTER_API_KEY secret)"
        default: "true"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install scrapling browsers
        run: scrapling install

      - name: Run scraper
        env:
          PYTHONUNBUFFERED: "1"
          PATH_ARG: ${{ github.event.inputs.path }}
          FILTERS: ${{ github.event.inputs.filters }}
          LIMIT: ${{ github.event.inputs.limit }}
          DETAIL: ${{ github.event.inputs.detail }}
        run: |
          FILTER_ARGS=""
          for kv in $FILTERS; do FILTER_ARGS="$FILTER_ARGS -f $kv"; done
          ARGS="--path $PATH_ARG --limit $LIMIT --out out/guazi.json $FILTER_ARGS"
          if [ "$DETAIL" = "false" ]; then ARGS="$ARGS --no-detail"; fi
          echo "RUNNING: python -m scrapers.guazi $ARGS"
          python -m scrapers.guazi $ARGS

      - name: AI normalize (brand/model/trim)
        if: ${{ github.event.inputs.normalize == 'true' && env.OPENROUTER_API_KEY != '' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python -m core.normalizer out/guazi.json out/guazi.json

      - name: Show summary
        if: always()
        run: |
          [ -f out/guazi.json ] || exit 0
          python <<'PY'
          import json
          d = json.load(open('out/guazi.json'))
          print(f'Listings: {len(d)}')
          for l in d:
              acc = 'ACC' if l.get('accident_free') is False else 'ok'
              bn = l.get('brand_canonical') or l['brand']
              mn = l.get('model_canonical') or l['model']
              tr = l.get('trim') or ''
              print(f"  [{l.get('grade') or '-'}] {bn} {mn} {l.get('year')} {l.get('fuel')} {l.get('mileage_km')}km {l.get('price_raw')} vin={l.get('vin') or l.get('vin_mask')} {acc} | trim={tr}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guazi-listings
          path: out/guazi.json

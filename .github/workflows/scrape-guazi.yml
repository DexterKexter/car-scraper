name: scrape-guazi

on:
  workflow_dispatch:
    inputs:
      city:
        description: "Guazi city code (e.g. bj, sh, gz)"
        default: "bj"
      limit:
        description: "Number of listings"
        default: "10"
      detail:
        description: "Enrich detail pages (true/false)"
        default: "true"

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install scrapling browsers
        run: scrapling install

      - name: Run scraper
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          CITY="${{ github.event.inputs.city }}"
          LIMIT="${{ github.event.inputs.limit }}"
          DETAIL="${{ github.event.inputs.detail }}"
          ARGS="--city $CITY --limit $LIMIT --out out/guazi.json"
          if [ "$DETAIL" = "false" ]; then ARGS="$ARGS --no-detail"; fi
          python -m scrapers.guazi $ARGS

      - name: Show summary
        if: always()
        run: |
          if [ -f out/guazi.json ]; then
            echo "Listings: $(python -c 'import json;print(len(json.load(open(\"out/guazi.json\"))))')"
            head -c 2000 out/guazi.json
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guazi-listings
          path: out/guazi.json

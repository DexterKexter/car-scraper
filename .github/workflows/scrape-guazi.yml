name: scrape-guazi

on:
  workflow_dispatch:
    inputs:
      path:
        description: "Path filter: /used-cars/, /used-cars/<brand>/, /used-cars/<brand>/<model>/, /used-cars/<body>/"
        default: "/used-cars/"
      filters:
        description: "Query filters, space-separated key=value. Supported: price=MIN,MAX | horsepower=MIN,MAX | tradeType=buyItNow|sealedBid"
        default: ""
      limit:
        description: "Number of listings"
        default: "10"
      detail:
        description: "Enrich detail pages (true/false)"
        default: "true"
      grades:
        description: "Comma-separated Guazi grades to keep (e.g. 'S,A'). Empty = all."
        default: ""
      max_mileage_km:
        description: "Drop listings with higher mileage. Empty = no cap."
        default: ""
      min_year:
        description: "Drop listings older than this year. Empty = no cap."
        default: ""
      no_db:
        description: "Skip DB upsert (true = JSON artifact only)"
        default: "false"
  schedule:
    # Heartbeat: cron re-fires every 30 min as a safety net in case the
    # self-chain step (see end of job) breaks. Self-chain handles the
    # bulk of the cadence.
    - cron: "*/30 * * * *"

permissions:
  contents: read
  actions: write   # required for the self-redispatch step

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Cancel an in-flight run when a new one starts — prevents stacked
    # runs from the cron heartbeat overlapping with the self-chain.
    concurrency:
      group: scrape-guazi
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install scrapling browsers
        run: scrapling install

      # Persist normalizer cache between runs so we don't re-LLM repeated
      # (site, brand, model, title) tuples. SHA256-keyed in core/normalizer.py.
      - name: Restore normalizer cache
        uses: actions/cache@v4
        with:
          path: .cache/normalizer.sqlite
          key: normalizer-cache-${{ github.run_id }}
          restore-keys: |
            normalizer-cache-

      - name: Pipeline (scrape -> normalize -> upsert)
        env:
          PYTHONUNBUFFERED: "1"
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          # Build args. Cron runs use defaults; workflow_dispatch passes inputs.
          PATH_ARG="${{ github.event.inputs.path || '/used-cars/' }}"
          LIMIT="${{ github.event.inputs.limit || '10' }}"
          FILTERS="${{ github.event.inputs.filters }}"
          DETAIL="${{ github.event.inputs.detail || 'true' }}"
          GRADES="${{ github.event.inputs.grades }}"
          MAX_MILEAGE="${{ github.event.inputs.max_mileage_km }}"
          MIN_YEAR="${{ github.event.inputs.min_year }}"
          NO_DB="${{ github.event.inputs.no_db || 'false' }}"

          ARGS="guazi --path $PATH_ARG --limit $LIMIT --out out/guazi.json"
          for kv in $FILTERS; do ARGS="$ARGS -f $kv"; done
          [ "$DETAIL" = "false" ] && ARGS="$ARGS --no-detail"
          [ -n "$GRADES" ] && ARGS="$ARGS --grades $GRADES"
          [ -n "$MAX_MILEAGE" ] && ARGS="$ARGS --max-mileage-km $MAX_MILEAGE"
          [ -n "$MIN_YEAR" ] && ARGS="$ARGS --min-year $MIN_YEAR"
          [ "$NO_DB" = "true" ] && ARGS="$ARGS --no-db"

          echo "RUNNING: python -m core.pipeline $ARGS"
          python -m core.pipeline $ARGS

      - name: Show summary
        if: always()
        run: |
          [ -f out/guazi.json ] || exit 0
          python <<'PY'
          import json
          d = json.load(open('out/guazi.json'))
          print(f'Listings: {len(d)}')
          for l in d:
              acc = 'ACC' if l.get('accident_free') is False else 'ok'
              mark = l.get('mark') or l.get('brand_canonical') or l['brand']
              mf = l.get('model_family') or ''
              mn = l.get('model') or ''
              cmpl = l.get('complectation') or ''
              mf_s = f"[{mf}]" if mf and mf != mn else ""
              print(f"  [{l.get('grade') or '-'}] {mark} {mf_s} {mn} ({cmpl}) {l.get('year')} {l.get('fuel')} {l.get('mileage_km')}km {l.get('price_amount')} {l.get('currency')} vin={l.get('vin') or l.get('vin_mask')} {acc}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guazi-listings
          path: out/guazi.json

      # Self-chain: dispatch the next run on success. Daemon-style loop —
      # batches keep coming as fast as the API can keep up. Cron heartbeat
      # restarts the chain if a run ever fails (and breaks the chain).
      - name: Trigger next batch
        if: success() && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 15
          gh workflow run scrape-guazi.yml --ref ${{ github.ref_name }} -f limit=10
